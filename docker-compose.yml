services:
  backend:
    build:
      context: .
      dockerfile: backend/dev.Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/src/backend
      - ./data:/data
    environment:
      - ConnectionStrings__Invoicing=Data Source=/data/invoicing.db
      - ASPNETCORE_ENVIRONMENT=Development
      - TZ=Europe/Berlin
  # A new named volume takes its ownership from the image at the mount point.
  # node:22 has no node_modules there, so the volume starts out root-owned and
  # npm install, running as UID:GID, fails with EACCES. That happens whenever
  # the volume is created afresh: a new worktree (a new project name), or
  # `docker compose down -v`. Hand it to UID:GID before the frontend starts.
  node-modules-owner:
    image: node:22
    user: root
    volumes:
      - frontend-node-modules:/volumes/frontend
    command: ["chown", "${UID:-1000}:${GID:-1000}", "/volumes/frontend"]
  # The Vite dev server, proxying /odata to the backend container.
  frontend:
    image: node:22
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      node-modules-owner:
        condition: service_completed_successfully
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    ports:
      - "8080:8080"
volumes:
  frontend-node-modules:
