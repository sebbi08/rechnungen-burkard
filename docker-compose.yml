services:
  backend:
    build:
      context: .
      dockerfile: backend/dev.Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/src/backend
      - ./data:/data
    environment:
      - ConnectionStrings__Invoicing=Data Source=/data/invoicing.db
      - ASPNETCORE_ENVIRONMENT=Development
      - TZ=Europe/Berlin
  frontend:
    image: node:22
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    command: ["sh", "-c", "npm install && npx ui5 serve --port 8080 --accept-remote-connections"]
    ports:
      - "8080:8080"
  # The Vue evaluation frontend (docs/deviations.md D-003). Dev only: the
  # release image ships the OpenUI5 frontend. Proxies /odata to the backend
  # container like the UI5 dev server does.
  frontend-vue:
    image: node:22
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/frontend-vue
    volumes:
      - ./frontend-vue:/app/frontend-vue
      - frontend-vue-node-modules:/app/frontend-vue/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    ports:
      - "8082:8082"
volumes:
  frontend-node-modules:
  frontend-vue-node-modules:
