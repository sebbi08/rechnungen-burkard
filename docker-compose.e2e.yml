# The stack the E2E suite runs against: same two services as the dev stack, but
# fully separate from it — its own project, its own containers, its own port and
# a database that only lives as long as the container. Running it never touches
# the dev data in ./data, and it shares no build output with the dev stack, so
# both can be up at the same time.
#
# The services are built from the two deployable images, so a green E2E run also
# proves the frontend and backend images work as separate deployments.
name: invoicing-e2e

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - ConnectionStrings__Invoicing=Data Source=/data/invoicing.db
      - TZ=Europe/Berlin
    # in memory and world-writable: every container start begins with an empty
    # database, so runs cannot influence each other
    tmpfs:
      - /data:mode=0777

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - BACKEND_URL=http://backend:8080
    ports:
      - "${E2E_PORT:-8081}:8080"
    depends_on:
      - backend
