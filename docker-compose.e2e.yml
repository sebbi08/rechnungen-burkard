# The stack the E2E suite runs against: the release image, fully separate from
# the dev stack — its own project, its own container, its own port and a
# database that only lives as long as the container. Running it never touches
# the dev data in ./data, and it shares no build output with the dev stack, so
# both can be up at the same time.
#
# The service is built from the deployable image, so a green E2E run also proves
# the image that gets released works.
name: invoicing-e2e

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${E2E_PORT:-8081}:8080"
    # in memory and world-writable: every container start begins with an empty
    # database, so runs cannot influence each other
    tmpfs:
      - /data:mode=0777
