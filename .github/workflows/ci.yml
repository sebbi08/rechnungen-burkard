name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build backend/Invoicing.sln -c Release
      - name: Test
        run: dotnet test backend/Invoicing.sln -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The constitution puts integration and E2E tests ahead of unit tests, so the
  # Playwright suite runs on every change, against the image that gets released
  # — which also makes this the job that proves the image still builds.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the image
        run: docker build -t invoicing:e2e .
      - name: Start the app
        run: |
          docker run -d --name invoicing-e2e -p 8080:8080 invoicing:e2e
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "the app did not become healthy"
          docker logs invoicing-e2e
          exit 1
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # against the container started above, not the isolated compose stack a
      # local `npm test` spins up
      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Backend logs on failure
        if: failure()
        run: docker logs invoicing-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  # The commit-msg hook is what normally catches these, but it only runs on a
  # machine where `npm install` has been run at the repository root, and
  # `--no-verify` skips it. The release version is derived from these messages,
  # so it is worth checking them again here.
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Lint the new commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            FROM="${{ github.event.before }}"
            TO="${{ github.sha }}"
          fi
          # A branch's first push reports an all-zero "before"; there is no
          # range to check then, so look at the tip commit only.
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$FROM" --to "$TO" --verbose
          fi

  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: scripts/test-release-scripts.sh
