name: CI

on:
  push:
    # Renovate only opens a PR once its branch has checks (prCreation:
    # not-pending), so its update branches are checked on push too.
    branches: [main, "renovate/**"]
  pull_request:

# Nothing here writes to the repository, and the third-party actions below run
# with this token: read-only is all they get.
permissions:
  contents: read

# A newer push to the same branch or PR makes a running check pointless; it is
# cancelled so the runners go to the commit that counts. Each push to main
# keeps its own run: a release reads the checks of the commit it releases.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
      - name: Build
        run: dotnet build backend/Invoicing.sln -c Release
      - name: Test
        run: dotnet test backend/Invoicing.sln -c Release --no-build

  # The quick checks share one runner. Each of them takes seconds, and every job
  # is billed rounded up to the next minute, so four jobs cost four minutes or
  # more where one costs two. Once the tools are installed every check runs
  # even if one before it failed, so a red run reports all of them, the way
  # separate jobs did.
  #
  # The frontend check keeps it compiling and lint-clean; its behaviour is
  # covered by the E2E job.
  #
  # Format and commit messages are checked again here because the hooks that
  # check them on commit only exist where `npm install` has been run at the
  # repository root, and `--no-verify` skips them. The release version is
  # derived from the commit messages, so they are worth checking twice.
  # CSharpier runs through the SDK directly rather than through
  # scripts/csharpier.sh, which exists because the dev machine has no .NET SDK;
  # the runner has one.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commit-lint reads the commits between the base and the head
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
      - name: Install the root dependencies
        id: root-deps
        run: npm ci
      - name: Install the frontend dependencies
        id: frontend-deps
        working-directory: frontend
        run: npm ci
      - name: Install the .NET tools
        id: dotnet-tools
        working-directory: backend
        run: dotnet tool restore

      - name: "Frontend: typecheck"
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' }}
        working-directory: frontend
        run: npm run typecheck
      - name: "Frontend: lint"
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' }}
        working-directory: frontend
        run: npm run lint
      - name: "Frontend: build"
        if: ${{ !cancelled() && steps.frontend-deps.outcome == 'success' }}
        working-directory: frontend
        run: npm run build

      - name: "Format: Prettier"
        if: ${{ !cancelled() && steps.root-deps.outcome == 'success' }}
        run: npx prettier --check .
      - name: "Format: CSharpier"
        if: ${{ !cancelled() && steps.dotnet-tools.outcome == 'success' }}
        working-directory: backend
        run: dotnet csharpier check .

      - name: Lint the new commit messages
        if: ${{ !cancelled() && steps.root-deps.outcome == 'success' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            FROM="${{ github.event.before }}"
            TO="${{ github.sha }}"
          fi
          # A branch's first push reports an all-zero "before", and a forced
          # push one this checkout may not have; there is no range to check
          # then, so look at the tip commit only.
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$FROM^{commit}" 2> /dev/null; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$FROM" --to "$TO" --verbose
          fi

      - name: Test the release scripts
        if: ${{ !cancelled() && steps.root-deps.outcome == 'success' }}
        run: scripts/test-release-scripts.sh

  # The constitution puts integration and E2E tests ahead of unit tests, so the
  # Playwright suite runs on every change, against the image that gets released
  # — which also makes this the job that proves the image still builds.
  #
  # The repository is public, so its runners have four cores and are not
  # billed by the minute: one runner works through the suite four tests at a
  # time, and three runners each take a third of it. fail-fast is off so a red
  # shard does not cancel the others and hide what they would have found.
  e2e:
    name: e2e (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Every shard builds the image itself rather than waiting for a job that
      # builds it once; the layer cache makes that cheap whenever the
      # dependencies have not changed, which is most runs. All three build the
      # same layers, so only the first shard writes them back: three uploads of
      # one cache would only spend the cache's storage and the runners' time.
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: invoicing:e2e
          cache-from: type=gha,scope=e2e-image
          cache-to: ${{ matrix.shard == 1 && 'type=gha,mode=max,scope=e2e-image' || '' }}
      - name: Start the app
        run: |
          docker run -d --name invoicing-e2e -p 8080:8080 invoicing:e2e
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "the app did not become healthy"
          docker logs invoicing-e2e
          exit 1
      - name: Install the E2E dependencies
        working-directory: e2e
        run: npm ci
      # The browser belongs to the Playwright version, so that version is the
      # cache key: an upgrade downloads the matching build, anything else
      # reuses it. The system libraries it needs live outside the cache and are
      # installed either way.
      - name: Read the Playwright version
        id: playwright
        working-directory: e2e
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Install Playwright's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium
      # against the container started above, not the isolated compose stack a
      # local `npm test` spins up
      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Backend logs on failure
        if: failure()
        run: docker logs invoicing-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report
