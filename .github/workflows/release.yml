name: Release

on:
  workflow_dispatch:

# One release at a time. Two runs would work out the same next version and
# race each other to the tag and the image.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The bump comes from the Conventional Commits since the last tag, so a
      # release never depends on remembering to pick the right one. Nothing
      # worth releasing means no release: the script fails and says so.
      - name: Work out the version and the changelog
        run: |
          VERSION=$(scripts/next-version.sh)
          echo "NEW_VERSION=v${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${VERSION}" >> "$GITHUB_ENV"
          scripts/changelog-entry.sh "$VERSION" > "$RUNNER_TEMP/entry.md"
          cat "$RUNNER_TEMP/entry.md"

      # The tests are not run again here; the checks CI left on the commit are
      # what says it can be released. A commit with a check that is red or
      # still running, or with none at all because CI never saw it, is refused
      # before anything is built -- the "Run workflow" button offers no other
      # guard. This job's own check, "release", is left out: it is running
      # while it looks, and an earlier failed release leaves one behind.
      - name: Require green checks on the commit
        run: |
          counts=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "release")] | "\(length) \([.[] | select(.status != "completed")] | length) \([.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length)"')
          read -r total running red <<< "$counts"
          if [ "$total" -eq 0 ]; then
            echo "no checks ran on ${{ github.sha }}" >&2
            exit 1
          elif [ "$running" -gt 0 ]; then
            echo "${running} of ${total} checks are still running" >&2
            exit 1
          elif [ "$red" -gt 0 ]; then
            echo "${red} of ${total} checks are not green" >&2
            exit 1
          fi
          echo "all ${total} checks green"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image: the app is deployed as a single container, frontend and
      # backend together. It is pushed under the commit's own tag first, so
      # that nothing anyone pulls by version exists until the git state below is
      # secured, and a build that fails leaves no trace in git. The version and
      # `latest` tags are added to this same image at the end, so what the tag
      # names and what the image holds cannot differ.
      - name: Build and push the image under the commit's tag
        env:
          PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker build --build-arg VERSION="${{ env.BUILD_VERSION }}" \
            --build-arg PRIMEUI_LICENSE \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" .
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"

      # The changelog is committed before the tag is cut, so the tag points at
      # the commit that carries its own entry. A push to the branch since the
      # checkout rejects this one, and the run stops here: no tag, no versioned
      # image, nothing to undo -- the next run starts over from the new tip.
      - name: Record the release in the changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/prepend-changelog.sh "$RUNNER_TEMP/entry.md"
          git add CHANGELOG.md
          git commit -m "chore: release ${{ env.NEW_VERSION }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create tag, version the image, and publish the GitHub release
        run: |
          git tag "${{ env.NEW_VERSION }}"
          git push origin "${{ env.NEW_VERSION }}"
          IMAGE="ghcr.io/${{ github.repository }}"
          VERSION="${{ env.NEW_VERSION }}"
          docker tag "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          # `latest` is main's newest release, not whichever branch ran last
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          gh release create "${{ env.NEW_VERSION }}" \
            --title "${{ env.NEW_VERSION }}" \
            --notes-file "$RUNNER_TEMP/entry.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
