specVersion: "3.2"
metadata:
  name: burkard.invoicing
type: application
resources:
  configuration:
    paths:
      webapp: src
framework:
  name: OpenUI5
  version: "1.151.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transpileTypeScript: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    # - name: ui5-middleware-hmr
    #   afterMiddleware: compression
    #   configuration:
    #     port: 35739
    #     watchPath: "src"
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /odata
      configuration:
        baseUri: "http://backend:8080/odata"
